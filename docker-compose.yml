version: "3.8"

services:
  # 应用服务
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=gin_template
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - KAFKA_ADDR=kafka:9092
    depends_on:
      - mysql
      - redis
      - elasticsearch
      - kafka
    networks:
      - app-network

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=gin_template
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - app-network

  # Elasticsearch 搜索引擎（单节点，开发环境）
  elasticsearch:
    image: elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      # 开发环境关闭安全认证，生产环境请开启并配置证书
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    # 容器内 elasticsearch 用户 uid/gid 为 1000，Linux 下需保证目录归属
    # sudo chown -R 1000:1000 ./data/elasticsearch
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app-network

  # Kafka 消息队列（KRaft 单节点，开发环境）
  kafka:
    image: bitnamilegacy/kafka:4.0.0
    environment:
      # Bitnami 镜像用 KAFKA_CFG_ 前缀把变量映射为 broker 配置
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      # INTERNAL 供容器内应用访问，EXTERNAL 供宿主机访问，CONTROLLER 仅集群内部使用
      - KAFKA_CFG_LISTENERS=INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      # 数据目录需落在挂载点内（Bitnami 镜像默认持久化目录为 /bitnami/kafka）
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data
      # 开发环境自动创建 database_sync、feed_push 等 topic
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      # 单节点副本因子只能为 1，否则内部 topic 无法创建
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_CFG_NUM_PARTITIONS=3
    ports:
      # 宿主机 9092 转发到 EXTERNAL 监听器，本地 go run 仍可用 localhost:9092
      - "9092:9094"
    volumes:
      # Bitnami 镜像以 uid 1001 运行，Linux 下需保证目录归属
      # sudo chown -R 1001:1001 ./data/kafka
      # 集群 ID 在首次启动时生成并写入 ./data/kafka/data/meta.properties，删除该目录会重建集群
      - ./data/kafka:/bitnami/kafka
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
