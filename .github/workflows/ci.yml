name: Basic CI

on:
  push:
  pull_request:

jobs:
  go-validate:
    name: Go validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build packages
        run: go build ./...
